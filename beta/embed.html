<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arplane Songs - ฝังเพลง</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .embed-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }

        #audio {
            width: 100%;
            display: none;
        }

        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        #play-pause {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: #fff;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-size: 1em;
        }

        #play-pause:hover {
            background: #0056b3;
        }

        #progress {
            width: 100%;
            margin-top: 10px;
        }

        #time-info {
            font-family: 'Roboto', sans-serif;
            margin: 10px 0;
            text-align: center;
        }

        #song-title {
            font-family: 'Roboto', sans-serif;
            font-size: 1.2em;
            text-align: center;
            margin: 0;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            font-family: 'Roboto', sans-serif;
            font-size: 0.9em;
            color: #555;
        }

        footer span {
            color: #007bff;
        }

        .lyrics-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background-color: #fff;
            text-align: center;
            position: relative;
            height: 150px;
            overflow: hidden;
        }

        .lyrics {
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.75s ease-in-out;
        }

        .previous, .current, .next {
            font-size: 18px;
            color: #333;
            line-height: 1.5;
        }

        .previous, .next {
            opacity: 0.5;
        }

        .current {
            opacity: 1;
            font-weight: bold;
            background: #ffeb3b;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="embed-container">
        <h1 id="song-title">ชื่อเพลง</h1>
        <audio id="audio" autoplay></audio>
        <div id="controls">
            <button id="play-pause">เล่น</button>
            <input type="range" id="progress" value="0" min="0" max="100" step="1">
            <div id="time-info">00:00/00:00</div>
        </div>
        <div class="lyrics-container">
            <div id="lyrics" class="lyrics">
                <div id="previous" class="previous"></div>
                <div id="current" class="current"></div>
                <div id="next" class="next"></div>
            </div>
        </div>
        <footer>
            Powered by Arplane Song <span>&#10084;</span>
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            playSong();
        });

        function playSong() {
            const songId = new URLSearchParams(window.location.search).get('songId');
            const apiKey = 'AIzaSyDgxTWXvIUQND4C7gzapRW6KNqEaBPQ8Y0';
            const sheetId = '1RghErH0w2v3msmgsNubUZxchF14ROg0WWNrKMsBZ6Ug';
            const sheetName = 'Songs';
            const srtFileId = '1ZchcX0JeNQnS6jj-_LnpGooiFNc1Yb1f';
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}?key=${apiKey}`;
            const srtUrl = `https://www.googleapis.com/drive/v3/files/${srtFileId}?alt=media&key=${apiKey}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const rowData = data.values.slice(1);
                    const song = rowData[songId];

                    document.getElementById('song-title').innerText = song[0];
                    const audio = document.getElementById('audio');
                    audio.src = song[2];

                    const playPauseButton = document.getElementById('play-pause');
                    const progress = document.getElementById('progress');
                    const timeInfo = document.getElementById('time-info');

                    playPauseButton.addEventListener('click', () => {
                        if (audio.paused) {
                            audio.play();
                            playPauseButton.innerText = 'หยุด';
                        } else {
                            audio.pause();
                            playPauseButton.innerText = 'เล่น';
                        }
                    });

                    progress.addEventListener('input', () => {
                        audio.currentTime = (progress.value / 100) * audio.duration;
                    });

                    audio.addEventListener('timeupdate', () => {
                        progress.value = (audio.currentTime / audio.duration) * 100;
                        updateTimeInfo();
                        updateLyrics(audio.currentTime, subtitles);
                    });

                    audio.addEventListener('loadedmetadata', () => {
                        progress.max = 100;
                        updateTimeInfo();
                        fetch(srtUrl)
                            .then(response => response.text())
                            .then(srtData => {
                                subtitles = parseSRT(srtData);
                                if (subtitles.length > 0) {
                                    document.querySelector('.lyrics-container').style.display = 'flex';
                                    updateLyrics(audio.currentTime, subtitles);
                                }
                            });
                    });

                    function updateTimeInfo() {
                        const currentTime = formatTime(audio.currentTime);
                        const duration = formatTime(audio.duration);
                        timeInfo.innerText = `${currentTime}/${duration}`;
                    }

                    function formatTime(seconds) {
                        const minutes = Math.floor(seconds / 60);
                        const secs = Math.floor(seconds % 60);
                        return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
                    }

                    function parseSRT(data) {
                        const subtitles = [];
                        const lines = data.split('\n');
                        let index = 0;
                        while (index < lines.length) {
                            if (lines[index].trim() === '') {
                                index++;
                                continue;
                            }
                            const number = parseInt(lines[index++]);
                            const timeRange = lines[index++].split(' --> ');
                            const startTime = convertToSeconds(timeRange[0]);
                            const endTime = convertToSeconds(timeRange[1]);
                            const text = [];
                            while (index < lines.length && lines[index].trim() !== '') {
                                text.push(lines[index++]);
                            }
                            subtitles.push({ startTime, endTime, text: text.join('<br>') });
                        }
                        return subtitles;
                    }

                    function convertToSeconds(time) {
                        const [h, m, s] = time.split(':');
                        const [sec, ms] = s.split(',');
                        return parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(sec) + parseInt(ms) / 1000;
                    }

                    function updateLyrics(currentTime, subtitles) {
                        let previousSubtitleIndex = -1;
                        let currentSubtitleIndex = -1;
                        let nextSubtitleIndex = -1;

                        for (let i = 0; i < subtitles.length; i++) {
                            const subtitle = subtitles[i];
                            if (subtitle.endTime < currentTime) {
                                previousSubtitleIndex = i;
                            }
                            if (subtitle.startTime <= currentTime && subtitle.endTime >= currentTime) {
                                currentSubtitleIndex = i;
                            }
                            if (subtitle.startTime > currentTime && nextSubtitleIndex === -1) {
                                nextSubtitleIndex = i;
                            }
                        }

                        const previousSubtitle = previousSubtitleIndex >= 0 ? subtitles[previousSubtitleIndex] : null;
                        const currentSubtitle = currentSubtitleIndex >= 0 ? subtitles[currentSubtitleIndex] : null;
                        const nextSubtitle = nextSubtitleIndex >= 0 ? subtitles[nextSubtitleIndex] : null;

                        document.getElementById('previous').innerHTML = previousSubtitle ? previousSubtitle.text : '';
                        document.getElementById('current').innerHTML = currentSubtitle ? currentSubtitle.text : '';
                        document.getElementById('next').innerHTML = nextSubtitle ? nextSubtitle.text : '';

                        // เคลื่อนที่เนื้อเพลง
                        const lyricsElement = document.querySelector('.lyrics');
                        if (currentSubtitle) {
                            const currentOffset = -(currentSubtitleIndex / subtitles.length) * 100;
                            lyricsElement.style.transform = `translateY(${currentOffset}%)`;
                        }
                    }
                });
        }
    </script>
</body>
</html>
